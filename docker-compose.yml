# Docker Compose Stack for my Home-Server, Knuspii
# Backups are automatically done with a bash script
# Cleanups are automatically done with a bash script
# Disks health is checked with a bash script
# Containers uptime is checked with a bash script

x-defaults: &defaults
  restart: unless-stopped
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "1"

services:
  # --- Homepage (Dashboard) ---
  glance:
    container_name: glance
    image: glanceapp/glance:latest
    <<: *defaults
    ports:
      - "80:8080"
    volumes:
      - ./glance:/app/config
    environment:
      - TZ=${TZ}
      - TOKEN_FILE=/app/config/secret
    read_only: true


  # --- AdGuard Home (DNS & Adblock) ---
  adguard:
    container_name: adguardhome
    image: adguard/adguardhome:latest
    <<: *defaults
    # Port:5000
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./adguard-home/work:/opt/adguardhome/work
      - ./adguard-home/conf:/opt/adguardhome/conf


  # --- Filebrowser-Quantum (Files) ---
  filebrowser-quantum:
    container_name: filebrowser-quantum
    image: gtstef/filebrowser:latest
    <<: *defaults
    user: "1000:1000"
    volumes:
      - /mnt/data:/folder
      - ./filebrowser-quantum:/home/filebrowser/data
    ports:
      - "5001:80"


  # --- Wallos (Finanz) ---
  wallos:
    container_name: wallos
    image: bellamy/wallos:latest
    <<: *defaults
    ports:
      - "5002:80"
    environment:
      - TZ=${TZ}
    volumes:
      - ./wallos:/var/www/html/db
      - ./wallos/logos:/var/www/html/images/uploads/logos


# --- Vikunja (Server) ---
  vikunja:
    container_name: vikunja
    image: docker.io/vikunja/vikunja:latest
    user: "1000:1000"
    <<: *defaults
    ports:
      - "5003:3456"
    environment:
      - TZ=${TZ}
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SECRET}
      - VIKUNJA_SERVICE_PUBLICURL=http://home-server:5003
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=false
      - VIKUNJA_WEBHOOKS_ENABLED=true
      - VIKUNJA_OUTGOINGREQUESTS_ALLOWNONROUTABLEIPS=true
      - VIKUNJA_DATABASE_TYPE=sqlite
      - VIKUNJA_DATABASE_PATH=/app/vikunja/files/vikunja.db
    volumes:
      - ./vikunja:/app/vikunja/files:Z


  # --- Glances (Monitoring) ---
  glances:
    container_name: glances
    image: nicolargo/glances:latest-full
    <<: *defaults
    ports:
      - "5004:61208"
    environment:
      - TZ=${TZ}
      - GLANCES_OPT=-w -B 0.0.0.0 --config /etc/glances/glances.conf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./glances/glances.conf:/etc/glances/glances.conf:ro
    pid: host
    read_only: true


  # --- n8n (Workflow Automation) ---
  n8n:
    container_name: n8n
    image: n8nio/n8n:latest
    <<: *defaults
    ports:
      - "5005:5678"
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_HOST=n8n.home-server
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=child_process
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=30
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000
    volumes:
      - ./n8n:/home/node/.n8n
    mem_limit: "2000m"
    cpus: "2.0"


  # --- Dozzle (Docker Logs) ---
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    <<: *defaults
    ports:
      - "5006:8080"
    environment:
      - TZ=${TZ}
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data


  # --- IT-Tools ---
  it-tools:
    container_name: it-tools
    image: corentinth/it-tools:latest
    <<: *defaults
    ports:
      - "5007:80"

networks:
  default:
    name: homeserver_network
    driver: bridge
